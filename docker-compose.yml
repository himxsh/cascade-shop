services:
  postgres:
    image: postgres:16-alpine
    container_name: cascade-shop-pg
    environment:
      POSTGRES_USER: shop
      POSTGRES_PASSWORD: shop
      POSTGRES_DB: cascade_shop
    ports:
      - "5433:5432"
    volumes:
      - ./db/init.sql:/docker-entrypoint-initdb.d/01_init.sql:ro
      - shop_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U shop -d cascade_shop"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  shop_pg_data:
